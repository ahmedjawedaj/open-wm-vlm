name: Bug report
description: Report a reproducible implementation or documentation problem
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, config, Python/dependency versions and relevant output. Remove credentials.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Dataset provenance
      description: Include generator version and manifest hashes when relevant.
