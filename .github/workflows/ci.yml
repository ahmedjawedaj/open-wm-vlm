name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c constraints-dev.txt -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - name: Check public Git tree
        run: python scripts/check_publication.py
      - name: Validate citation metadata
        if: matrix.python == '3.13'
        run: |
          python -m pip install cffconvert==2.0.0
          cffconvert --validate
      - name: Build wheel from source distribution
        run: python -m build
      - name: Check public distribution contents
        run: python scripts/check_publication.py --archives dist/*.tar.gz dist/*.whl
      - name: Check wheel without checkout import paths
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install -c constraints-dev.txt dist/*.whl
          "$RUNNER_TEMP/wheel-check/bin/python" -I -c "from wm_vlm.data.config import GENERATOR_VERSION; from wm_vlm.data.audit import audit_dataset; assert GENERATOR_VERSION == '2'"
